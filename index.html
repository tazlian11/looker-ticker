<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 45px;

    display: flex;
    align-items: center;

    background: #ffffff;
    overflow: hidden;
}

.scrolling-text {
    color: #333333;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
    white-space: nowrap;

    animation: slideLeft 25s linear infinite;
}

@keyframes slideLeft {
    0% {
        transform: translateX(100vw);
    }

    100% {
        transform: translateX(-100%);
    }
}
</style>

</head>

<body>

<div class="footer">
    <div class="scrolling-text">
        ✦ Created By Tazlian Islam &nbsp;&nbsp; • &nbsp;&nbsp; Thanks for visiting &nbsp;&nbsp; ✦
    </div>
</div>

</body>
</html>
