<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40px;

      background: #ffffff;
      color: #000000;

      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;

      border-top: 1px solid #dddddd;
    }

    .ticker {
      display: inline-block;
      padding-left: 100%;
      font-size: 14px;
      font-weight: 500;

      animation: scroll 18s linear infinite;
    }

    @keyframes scroll {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-100%);
      }
    }
  </style>
</head>

<body>

  <div class="footer">
    <div class="ticker">
      ✦ Created by Tazlian
      &nbsp;&nbsp;&nbsp; • &nbsp;&nbsp;&nbsp;
      Welcome to the dashboard
      &nbsp;&nbsp;&nbsp; • &nbsp;&nbsp;&nbsp;
      Thank you for visiting
    </div>
  </div>

</body>
</html>
