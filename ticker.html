<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
    }

    .ticker {
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        white-space: nowrap;
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: bold;
        color: #555555;
    }

    .ticker-text {
        display: inline-block;
        padding-left: 100%;
        animation: scroll 10s linear infinite;
    }

    @keyframes scroll {
        0% {
            transform: translateX(0);
        }

        100% {
            transform: translateX(-100%);
        }
    }
</style>
</head>

<body>

<div class="ticker">
    <div class="ticker-text">
        Created By Tazlian
    </div>
</div>

</body>
</html>
